name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Metaclick Macro" metaclick.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Metaclick-Macro-Windows
          path: "dist/Metaclick Macro.exe"
          if-no-files-found: error
          retention-days: 30
