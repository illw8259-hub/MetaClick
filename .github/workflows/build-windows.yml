name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow svglib reportlab
      - name: Create Windows icon
        shell: pwsh
        run: |
          @'
          from svglib.svglib import svg2rlg
          from reportlab.graphics import renderPM
          from PIL import Image
          drawing = svg2rlg("assets/metaclick-icon.svg")
          if drawing is None:
              raise RuntimeError("Could not read assets/metaclick-icon.svg")
          renderPM.drawToFile(drawing, "assets/metaclick-icon.png", fmt="PNG", dpi=96)
          image = Image.open("assets/metaclick-icon.png").convert("RGBA")
          image.save("assets/metaclick-icon.ico", format="ICO", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | python -
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Metaclick Macro" --icon "assets/metaclick-icon.ico" metaclick.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Metaclick-Macro-Windows
          path: "dist/Metaclick Macro.exe"
          if-no-files-found: error
          retention-days: 30
